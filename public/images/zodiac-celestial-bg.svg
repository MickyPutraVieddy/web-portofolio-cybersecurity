<svg xmlns="http://www.w3.org/2000/svg" viewBox="620 -45 1000 1000" fill="none" role="img" aria-label="Animated celestial zodiac constellation and orbital background">
  <defs>
    <radialGradient id="halo" cx="70%" cy="48%" r="55%">
      <stop offset="0" stop-color="#0b5260" stop-opacity=".26"/>
      <stop offset=".46" stop-color="#07303f" stop-opacity=".10"/>
      <stop offset="1" stop-color="#020711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58f4e4" stop-opacity=".10"/>
      <stop offset=".48" stop-color="#4ad8e8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7b8dff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42f3dc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#42f3dc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#42aaff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="microgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#3aa6ba" stroke-opacity=".075" stroke-width=".7"/>
    </pattern>
  </defs>

  <style>
    path { fill: none; }
    .scanner { stroke-dasharray: 24 900; }
  </style>

  <!-- Transparent overlay: the page itself supplies the dark background. -->
  <ellipse cx="1120" cy="455" rx="520" ry="440" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#microgrid)" opacity=".34"/>

  <!-- Sparse stars across the full canvas, with most activity on the right. -->
  <g fill="#a9fff7">
    <circle class="spark" cx="112" cy="145" r="1.2" opacity=".45"/><circle class="spark" cx="325" cy="742" r="1" opacity=".5"/>
    <circle class="spark" cx="492" cy="218" r="1.3" opacity=".4"/><circle class="spark" cx="630" cy="80" r=".9" opacity=".55"/>
    <circle class="spark" cx="760" cy="790" r="1.2" opacity=".5"/><circle class="spark" cx="882" cy="132" r="1.4" opacity=".7"/>
    <circle class="spark" cx="1008" cy="64" r="1.1" opacity=".65"/><circle class="spark" cx="1284" cy="98" r="1.5" opacity=".55"/>
    <circle class="spark" cx="1468" cy="205" r="1.3" opacity=".65"/><circle class="spark" cx="1530" cy="540" r="1" opacity=".45"/>
    <circle class="spark" cx="1400" cy="780" r="1.5" opacity=".55"/><circle class="spark" cx="1010" cy="815" r=".9" opacity=".5"/>
    <circle class="spark" cx="850" cy="570" r="1" opacity=".55"/><circle class="spark" cx="575" cy="460" r="1.1" opacity=".35"/>
  </g>

  <!-- Slow celestial orbit grid -->
  <g class="counter" transform="">
    <circle cx="1120" cy="455" r="335" stroke="url(#line)" stroke-width="1.1" opacity=".55"/>
    <circle cx="1120" cy="455" r="300" stroke="#4ddfdc" stroke-opacity=".14" stroke-width=".8" stroke-dasharray="2 10"/>
    <ellipse cx="1120" cy="455" rx="430" ry="180" transform="rotate(-24 1120 455)" stroke="#49dce5" stroke-opacity=".28" stroke-width="1"/>
    <ellipse cx="1120" cy="455" rx="430" ry="112" transform="rotate(30 1120 455)" stroke="#7b8dff" stroke-opacity=".18" stroke-width="1"/>
    <ellipse cx="1120" cy="455" rx="410" ry="78" transform="rotate(67 1120 455)" stroke="#4be8d8" stroke-opacity=".15" stroke-width="1"/>
  </g>

  <!-- Zodiac belt: 12 celestial sectors and longitude meridians -->
  <g class="wheel">
    <circle cx="1120" cy="455" r="270" stroke="#63eee2" stroke-opacity=".52" stroke-width="1.25"/>
    <circle cx="1120" cy="455" r="246" stroke="#6aa7ff" stroke-opacity=".23" stroke-width=".8" stroke-dasharray="3 8"/>
    <circle cx="1120" cy="455" r="215" stroke="#57dce6" stroke-opacity=".16" stroke-width=".8"/>
    <path d="M850 455H1390M1120 185V725" stroke="#69f6e8" stroke-opacity=".24" stroke-width=".8"/>
    <path d="M929 264L1311 646M1311 264L929 646" stroke="#69f6e8" stroke-opacity=".11" stroke-width=".8"/>
    <ellipse cx="1120" cy="455" rx="270" ry="105" stroke="#58dfe5" stroke-opacity=".24" stroke-width=".9"/>
    <ellipse cx="1120" cy="455" rx="105" ry="270" stroke="#58dfe5" stroke-opacity=".24" stroke-width=".9"/>
    <ellipse cx="1120" cy="455" rx="270" ry="155" transform="rotate(45 1120 455)" stroke="#7a9cff" stroke-opacity=".13" stroke-width=".8"/>
    <ellipse cx="1120" cy="455" rx="270" ry="155" transform="rotate(-45 1120 455)" stroke="#7a9cff" stroke-opacity=".13" stroke-width=".8"/>
    <g stroke="#57e9df" stroke-opacity=".45" stroke-width="1">
      <path d="M1120 185v-15M1255 221l8-14M1354 320l14-8M1390 455h16M1354 590l14 8M1255 689l8 14M1120 725v15M985 689l-8 14M886 590l-14 8M850 455h-16M886 320l-14-8M985 221l-8-14"/>
    </g>
    <!-- 12 stylized constellation figures arranged around the zodiac belt -->
    <g stroke="#9cfbf2" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" fill="#aafff5" filter="url(#glow)">
      <g transform="translate(1120 185)"><path d="M-20 0L-7 -13L8 -5L22 -18M-7 -13L-2 9L16 15"/><circle cx="-20" cy="0" r="2.1"/><circle cx="-7" cy="-13" r="2.5"/><circle cx="8" cy="-5" r="1.8"/><circle cx="22" cy="-18" r="2"/><circle cx="-2" cy="9" r="1.8"/><circle cx="16" cy="15" r="2"/></g>
      <g transform="translate(1255 221) rotate(30)"><path d="M-20 -4L-4 -16L8 -2L20 11L3 17L-8 4Z"/><circle cx="-20" cy="-4" r="2"/><circle cx="-4" cy="-16" r="2"/><circle cx="8" cy="-2" r="2.4"/><circle cx="20" cy="11" r="2"/><circle cx="3" cy="17" r="2"/><circle cx="-8" cy="4" r="2"/></g>
      <g transform="translate(1354 320) rotate(60)"><path d="M-22 -8L-6 5L7 -14L21 1L8 17M-6 5L-9 22"/><circle cx="-22" cy="-8" r="2"/><circle cx="-6" cy="5" r="2.2"/><circle cx="7" cy="-14" r="2"/><circle cx="21" cy="1" r="2.4"/><circle cx="8" cy="17" r="2"/><circle cx="-9" cy="22" r="1.7"/></g>
      <g transform="translate(1390 455) rotate(90)"><path d="M-22 0L-8 -12L6 0L21 -10M-8 -12L-5 12L12 18"/><circle cx="-22" cy="0" r="2"/><circle cx="-8" cy="-12" r="2.3"/><circle cx="6" cy="0" r="2"/><circle cx="21" cy="-10" r="1.8"/><circle cx="-5" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></g>
      <g transform="translate(1354 590) rotate(120)"><path d="M-22 10L-8 -10L7 -4L19 -18M-8 -10L3 12L18 17"/><circle cx="-22" cy="10" r="2"/><circle cx="-8" cy="-10" r="2.2"/><circle cx="7" cy="-4" r="2"/><circle cx="19" cy="-18" r="2"/><circle cx="3" cy="12" r="2.2"/><circle cx="18" cy="17" r="1.8"/></g>
      <g transform="translate(1255 689) rotate(150)"><path d="M-20 0L-8 -14L6 -7L20 5L6 17L-7 8Z"/><circle cx="-20" cy="0" r="2"/><circle cx="-8" cy="-14" r="2.2"/><circle cx="6" cy="-7" r="2"/><circle cx="20" cy="5" r="2.2"/><circle cx="6" cy="17" r="2"/><circle cx="-7" cy="8" r="1.8"/></g>
      <g transform="translate(1120 725) rotate(180)"><path d="M-21 0L-8 -13L7 -4L20 -17M-8 -13L-2 10L13 15"/><circle cx="-21" cy="0" r="2"/><circle cx="-8" cy="-13" r="2.2"/><circle cx="7" cy="-4" r="2"/><circle cx="20" cy="-17" r="2"/><circle cx="-2" cy="10" r="2"/><circle cx="13" cy="15" r="2"/></g>
      <g transform="translate(985 689) rotate(210)"><path d="M-20 -9L-5 0L10 -15L21 1L7 17L-8 9Z"/><circle cx="-20" cy="-9" r="2"/><circle cx="-5" cy="0" r="2.2"/><circle cx="10" cy="-15" r="2"/><circle cx="21" cy="1" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="-8" cy="9" r="2"/></g>
      <g transform="translate(886 590) rotate(240)"><path d="M-22 4L-8 -12L7 -3L20 -15M-8 -12L-1 12L14 18"/><circle cx="-22" cy="4" r="2"/><circle cx="-8" cy="-12" r="2"/><circle cx="7" cy="-3" r="2.2"/><circle cx="20" cy="-15" r="2"/><circle cx="-1" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></g>
      <g transform="translate(850 455) rotate(270)"><path d="M-21 -3L-7 -16L8 -5L21 9M-7 -16L-2 12L13 18"/><circle cx="-21" cy="-3" r="2"/><circle cx="-7" cy="-16" r="2"/><circle cx="8" cy="-5" r="2.2"/><circle cx="21" cy="9" r="2"/><circle cx="-2" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></g>
      <g transform="translate(886 320) rotate(300)"><path d="M-20 -5L-7 -15L8 -2L20 12L4 17L-10 7Z"/><circle cx="-20" cy="-5" r="2"/><circle cx="-7" cy="-15" r="2"/><circle cx="8" cy="-2" r="2.2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="17" r="2"/><circle cx="-10" cy="7" r="2"/></g>
      <g transform="translate(985 221) rotate(330)"><path d="M-21 5L-8 -12L6 -4L20 -18M-8 -12L-2 11L13 15"/><circle cx="-21" cy="5" r="2"/><circle cx="-8" cy="-12" r="2"/><circle cx="6" cy="-4" r="2.2"/><circle cx="20" cy="-18" r="2"/><circle cx="-2" cy="11" r="2"/><circle cx="13" cy="15" r="2"/></g>
    </g>
  </g>

  <!-- Independent tracer orbit and bright moving satellite -->
  <g class="drift">
    <ellipse cx="1120" cy="455" rx="455" ry="230" transform="rotate(-18 1120 455)" stroke="url(#orbit)" stroke-width="1.4" opacity=".75"/>
    <circle cx="0" cy="0" r="7" fill="#59fff0" opacity=".28" filter="url(#softGlow)"/>
  </g>
  <g class="pulse" filter="url(#glow)"><circle cx="1442" cy="318" r="3.2" fill="#a5fff7"/><circle cx="1442" cy="318" r="10" stroke="#62f4e4" stroke-opacity=".42"/></g>
  <g class="pulse2" filter="url(#glow)"><circle cx="910" cy="690" r="2.5" fill="#8ea8ff"/><circle cx="910" cy="690" r="8" stroke="#8ea8ff" stroke-opacity=".4"/></g>

  <!-- Subtle meridian scan -->
  <path class="scanner" d="M1120 116 A339 339 0 0 1 1459 455" stroke="#70fff0" stroke-width="2" opacity=".8"/>
</svg>
